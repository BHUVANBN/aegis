# Local development only. API port is bound to 127.0.0.1 and uses the dev auth mode.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_dev_pw
      POSTGRES_DB: aegis
    ports: ['127.0.0.1:5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aegis -d aegis']
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      NODE_ENV: development
      AUTH_MODE: dev
      DATABASE_URL: postgres://aegis:aegis_dev_pw@db:5432/aegis
      CORS_ORIGINS: http://localhost:5173
      ARG_ENABLED: 'false'
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      db: { condition: service_healthy }
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -w @aegis/web"
    environment:
      VITE_AUTH_MODE: dev
      VITE_HOST: 0.0.0.0
      API_PROXY_TARGET: http://api:8080
    volumes: ['.:/app']
    ports: ['127.0.0.1:5173:5173']
    depends_on: [api]
volumes:
  pgdata:
